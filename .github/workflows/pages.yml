# Publishes the static demo (frontend/demo) to GitHub Pages.
# Runs only when the repository is public: on the free plan, Pages is not available for private repositories.
# One-time setup after making the repo public: Settings > Pages > Source: "GitHub Actions".
name: Publish demo to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["frontend/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/demo
      - id: deployment
        uses: actions/deploy-pages@v4
